name: "Bug en jeu"
description: "Plantage, texte illisible ou corrompu, caractère manquant, écran figé."
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Si possible, vérifiez d'abord que le problème n'existe pas aussi sans le patch
        (version anglaise d'origine).
  - type: textarea
    id: quoi
    attributes:
      label: "Que se passe-t-il ?"
      description: "Et à quel moment : lieu, personnage, action."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Version du patch"
      placeholder: "v0.1.0, ou le commit si vous avez construit vous-même"
    validations:
      required: true
  - type: input
    id: emulateur
    attributes:
      label: "Émulateur ou console"
      placeholder: "Azahar 2126.2, New 3DS + Luma3DS…"
    validations:
      required: true
  - type: textarea
    id: capture
    attributes:
      label: "Capture d'écran ou sauvegarde"
      description: "Une sauvegarde juste avant le bug fait gagner un temps précieux."
