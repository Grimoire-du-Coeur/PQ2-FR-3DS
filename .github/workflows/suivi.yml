# Recalcule l'avancement et le publie sur la branche « suivi » : SUIVI.md,
# les badges et la carte d'avancement que le README affiche.
#
# La branche main est protégée (Pull Request, relecture et vérifications
# obligatoires) : aucun robot n'y écrit. La branche « suivi » est refaite de
# zéro à chaque fois, en un seul commit, pour rester légère.
#
# Il tourne aussi quand une Pull Request s'ouvre, bouge ou se ferme : une
# proposition ouverte doit apparaître en « en cours » TOUT DE SUITE, sinon
# deux personnes prennent le même dossier dans la journée. Il utilise
# `pull_request_target` (et non `pull_request`) parce qu'une proposition
# venue d'un fork n'aurait qu'un jeton en lecture seule ; en contrepartie, ce
# déclencheur s'exécute avec les droits du dépôt : on ne récupère donc JAMAIS
# le code de la proposition — checkout explicite de main, et rien d'autre.
name: Suivi

on:
  push:
    branches: [main]
    paths:
      - 'trad/**'
      - 'outils/stats.py'
      - 'outils/memoire.py'
      - '.github/workflows/suivi.yml'
  pull_request_target:
    types: [opened, reopened, closed, synchronize, ready_for_review]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: suivi
  cancel-in-progress: true

jobs:
  suivi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # jamais le code de la proposition, voir plus haut

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Relever les propositions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state open --json number,author,files,isDraft > /tmp/ouvertes.json || echo '[]' > /tmp/ouvertes.json
          gh pr list --state merged --limit 500 --json number,author,files > /tmp/fusionnees.json || echo '[]' > /tmp/fusionnees.json

      - run: python outils/stats.py --sortie build/suivi --ouvertes /tmp/ouvertes.json --fusionnees /tmp/fusionnees.json

      - name: Publier sur la branche suivi
        env:
          JETON: ${{ github.token }}
        run: |
          cd build/suivi
          git init -q -b suivi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Suivi : avancement au commit ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" suivi
