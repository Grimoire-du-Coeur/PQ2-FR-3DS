# Recalcule l'avancement après chaque fusion qui touche aux traductions, et
# le publie sur la branche « suivi » : SUIVI.md, les badges et la carte
# d'avancement que le README affiche.
#
# La branche main est protégée (Pull Request, relecture et vérifications
# obligatoires) : aucun robot n'y écrit. La branche « suivi » est refaite de
# zéro à chaque fois, en un seul commit, pour rester légère.
#
# Personne ne met ces fichiers à jour à la main : c'est la seule façon
# qu'ils soient justes, et un chiffre faux sur la page d'accueil décourage
# plus qu'il ne recrute.
name: Suivi

on:
  push:
    branches: [main]
    paths:
      - 'trad/**'
      - 'outils/stats.py'
      - '.github/workflows/suivi.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: suivi
  cancel-in-progress: true

jobs:
  suivi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python outils/stats.py --sortie build/suivi
      - name: Publier sur la branche suivi
        env:
          JETON: ${{ github.token }}
        run: |
          cd build/suivi
          git init -q -b suivi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Suivi : avancement au commit ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" suivi
